name: Check

on:
  push:
    paths: ["resources.yml", "README*", "scripts/**", "package*.json", ".nvmrc", ".github/workflows/check.yml"]
  pull_request:
    paths: ["resources.yml", "README*", "scripts/**", "package*.json", ".nvmrc", ".github/workflows/check.yml"]

permissions:
  contents: read

jobs:
  readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run images
      - run: npm run check
