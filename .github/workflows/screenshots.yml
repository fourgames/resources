name: Screenshots

on:
  schedule:
    - cron: "0 4 * * *" # daily, 04:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated ids to capture (empty = all)"
        required: false
        type: string
      force:
        description: "Replace images even if the site barely changed"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$FORCE" = "true" ] && args+=(--force)
          npm run capture -- "${args[@]}"

      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: .cache/
          retention-days: 7

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/images README.md
          if git diff --cached --quiet; then
            echo "No visible changes, nothing to commit."
            exit 0
          fi
          git commit -m "Update screenshots"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((attempt * 10))
          done
          exit 1
