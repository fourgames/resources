name: Screenshots

on:
  schedule:
    - cron: "0 4 * * *" # daily, 04:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated ids to capture (empty = all)"
        required: false
        type: string
      force:
        description: "Replace images even if the site barely changed"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Screenshots live on the single-commit `screenshots` branch, mirrored into ./images.
      - run: npm run images

      - name: Capture screenshots
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$FORCE" = "true" ] && args+=(--force)
          npm run capture -- "${args[@]}"

      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: .cache/
          retention-days: 7

      # Replaces the branch with one fresh commit, so image history never grows.
      - name: Publish screenshots
        run: npm run images:push

      # README.md only changes here when an entry gets its first image.
      - name: Commit README
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "README unchanged."
            exit 0
          fi
          git commit --quiet -m "Update README images"
          for attempt in 1 2 3; do
            # On conflict keep the bot's images (-X theirs = the commit being replayed), then
            # rebuild README.md so it matches whatever resources.yml is on main now.
            if git pull --rebase --quiet -X theirs; then
              npm run build --silent
              git add README.md
              git diff --cached --quiet || git commit --quiet --amend --no-edit
              git push --quiet && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 10))
          done
          exit 1
