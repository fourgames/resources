# Single source of truth for README.md.
# Add a resource here, then run `npm run build`. Screenshots are captured daily by
# .github/workflows/screenshots.yml (or locally with `npm run capture -- --only <id>`).
# Entries are sorted alphabetically inside each group when the README is generated.

defaults:
  viewport: { width: 1440, height: 810 } # 16:9
  waitMs: 1500
  diffThreshold: 0.05 # share of changed pixels needed before an image is replaced
  minAgeDays: 14      # never replace an image younger than this
  columns: 3

tags:
  - 2D
  - 3D
  - Animations
  - Art
  - Fonts
  - Free
  - Icons
  - LLM
  - MCP
  - Music
  - Open Source
  - Paid
  - Palettes
  - Pixel Fonts
  - SFX
  - Textures
  - Video
  - Web

# Captured like any resource, but used by README.template.md instead of the grid.
extras:
  - id: jonas-tyroller
    name: "Jonas Tyroller: Just make great games"
    url: https://youtu.be/xej_wsBB5tY
    shot: { image: "https://i.ytimg.com/vi/xej_wsBB5tY/maxresdefault.jpg" }
  - id: genre-peaks
    name: When each genre peaked (Steam revenue report)
    url: https://weloveit.io/developers/steam-revenue-report/
    shot: { scrollTo: "text=/when each genre peaked/i", scrollOffset: 12, hide: [nav.sticky-top], waitMs: 3000 }

sections:
  - id: engine
    title: Game Engine & Template
    emoji: "🧩"
    intro: |
      `Godot Engine`: Your free, open-source game engine. Develop your 2D & 3D games, cross-platform projects, or even XR ideas!
      Paired with the `Four Games Template`, you get a project template with ongoing video tutorial support. Focused on architecture and automation with Controller-First design.
    groups:
      - entries:
          - id: godot-engine
            name: Godot Engine
            url: https://store.steampowered.com/app/404790/Godot_Engine/
            tags: [2D, 3D, Open Source]
            shot: { waitMs: 6000, hide: [.banner_open_in_steam] } # let the Steam trailer poster load
          - id: four-games-template
            name: Four Games Template
            url: https://github.com/fourgames/template
            tags: [Open Source]
            note: Controller-First Godot template

  - id: ai
    title: AI Assistants
    emoji: "🤖"
    intro: |
      AI won't make your game fun, but it can take the tedious parts off your plate. `godot-ai` lets Claude read and edit your open Godot project directly: scenes, nodes, scripts and more.
    groups:
      - entries:
          - id: godot-ai
            name: godot-ai
            url: https://github.com/hi-godot/godot-ai
            tags: [MCP, Open Source]
            note: Let Claude drive the Godot editor
          - id: claude
            name: Claude
            url: https://www.anthropic.com
            tags: [LLM]

